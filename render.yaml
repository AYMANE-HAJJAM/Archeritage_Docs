# Optional Docker Blueprint; the existing production service uses Native Node.
# This file does not describe its live dashboard configuration.
# Do not sync/create a Blueprint to fix the existing service. See
# docs/architecture/render-office-previews.md for the in-place runtime change.
services:
  - type: web
    name: archeritage-docs
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /login
    envVars:
      - key: NODE_ENV
        value: production
      # Optional override; otherwise /usr/bin/ffmpeg from the image is used.
      - key: FFMPEG_PATH
        value: /usr/bin/ffmpeg
      - key: SOFFICE_PATH
        value: /usr/bin/soffice
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: APP_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: B2_ENDPOINT
        sync: false
      - key: B2_REGION
        sync: false
      - key: B2_BUCKET_NAME
        sync: false
      - key: B2_KEY_ID
        sync: false
      - key: B2_APPLICATION_KEY
        sync: false
